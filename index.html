<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#af8ebe">
<title>Laxii</title>
<meta property="og:title" content="Laxii">
<meta property="og:description" content="Laxii's profile site">
<style>
  /* フォント: Zen Kaku Gothic New(OFL)を使うなら assets/fonts/ に置いて下のコメントを外す */
  /*
  @font-face { font-family: "Zen Kaku Gothic New"; src: url(assets/fonts/ZenKakuGothicNew.woff2) format("woff2"); }
  */
  :root { --accent: #af8ebe; --text: #b4b5bf; --link: #646570; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--text);
    background-color: #282828;
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    font-size: 16px;
  }
  a { color: var(--link); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* 背景: assets/bg.jpg が無ければ紫のグラデーションになる */
  #background {
    position: fixed; inset: 0; z-index: -1;
    background-image: url(assets/bg.jpg), linear-gradient(160deg, #3d3148 0%, #1d1c24 100%);
    background-position: 50%; background-size: cover;
    filter: blur(12px) brightness(.75); transform: scale(1.1); /* ぼかしで縁が透けないよう少し拡大 */
  }

  header {
    position: absolute; top: 0; left: 0; width: 100%; height: 5vh;
    display: flex; justify-content: flex-end; align-items: center;
  }
  header a { padding-right: 2px; }
  .hidden-link, .hidden-link a { color: var(--text); text-decoration: none; }
  .icon { width: 20px; height: 20px; fill: #fff; display: block; }


  #page {
    display: flex; flex-direction: column; justify-content: center;
    min-height: 100vh; margin: 0 18%; padding: 40px 0;
  }
  #info-box {
    position: relative; font-size: 18px; padding: 0 40px 40px;
    border: 3px solid var(--accent); border-radius: 15px;
    background-color: rgba(0,0,0,.5);
  }

  #non {
    position: absolute; top: -50px; right: -75px; width: 150px;
    transform: rotate(10deg);
  }
  #title-container { text-align: right; }
  #title-container a {
    color: var(--accent); text-decoration: none;
    font-family: "UD Digi Kyokasho N-R", "Kyokasho ICA", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 32px; font-weight: 400; text-shadow: -3px 4px 8px #000;
  }
  #intro-container h3 { margin: 0; font-size: 16px; font-weight: 400; display: inline-block; }
  #intro-container h1 { margin: 0; padding-left: 3px; display: inline-block; }

  #projects-container {
    display: flex; flex-direction: column; width: 100%;
    margin-bottom: 15px; padding: 5px;
    background: rgba(88,86,96,.4); font-family: monospace; font-size: 16px;
  }
  .fish { color: #37cc58; }
  .project { width: 100%; margin-bottom: 10px; display: flex; align-items: center; }
  .project p, #projects-container p { margin: 0; }
  .project a { color: #fff; text-decoration: none; }
  .project a:hover { text-decoration: underline; }

  #bottom-bar { display: flex; justify-content: space-between; }
  .socials-bar { width: 50%; }
  .socials-bar a { display: inline-flex; align-items: center; }
  .socials-bar svg { width: 16px; height: 16px; padding-top: 4px; fill: currentColor; }
  .socials-bar span { margin-left: 5px; }
  .social-divide { color: var(--link); margin: 0 5px; }

  #banner {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    height: 230px; margin-top: 20px;
    border: 3px solid var(--accent); border-radius: 15px;
    background-image: url(assets/banner.webp), linear-gradient(135deg, #4a3d58 0%, #25232d 100%);
    background-size: cover; background-position: 43%;
  }
  #link-container { display: flex; flex-direction: column; align-items: center; margin-right: 55%; }
  #link-container a { color: #f1edf5; text-decoration: none; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #link-container a:hover { text-decoration: underline; }
  #link-divide {
    width: 35%; height: 3px; margin: 5px 0;
    background: linear-gradient(90deg, #0000 0%, #ffffff55 15% 85%, #0000 100%);
  }
  @media (max-width: 1280px) {
    #bottom-bar { flex-direction: column; }
    .socials-bar { width: 100%; }
  }
  @media (max-width: 1350px) {
    #non { width: 90px; top: -10px; right: -30px; }
  }
  @media (max-width: 700px) {
    #page { margin: 3%; }
    #info-box { font-size: 16px; }
    #non { width: 70px; top: -2px; right: -18px; }
    #link-container { margin-right: 0; }
  }
</style>
</head>
<body>
<div id="background"></div>

<header>
  <a class="hidden-link" href="https://github.com/lucy2566" aria-label="GitHub">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>

    <h2 id="title-container"><a href="#">Laxii</a></h2>

    </div>

    <div id="bottom-bar">
      <div class="socials-bar hidden-link">
        <a href="https://github.com/lucy2566">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
          <span>github</span>
        </a>
        <span class="social-divide">•</span>
        <a href="mailto:contact.github.lucy2566.unbaked459@passinbox.com"><span style="margin-left:0">mail</span></a>
      </div>
    </div>
  </div>

  <!-- バナー画像は assets/banner.webp に置く。無ければ紫のグラデーション -->
  <div id="banner">
    <div id="link-container">
      <a href="https://github.com/lucy2566">github.com/lucy2566</a>
      <div id="link-divide"></div>
      <a href="mailto:contact.github.lucy2566.unbaked459@passinbox.com">mail</a>
    </div>
  </div>
</section>

</body>
</html>
